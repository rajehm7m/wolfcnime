<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WOLF CINEMA</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0d0d11;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      position: relative;
      overflow-x: hidden;
    }

    /* أنيميشن مقدمة Wolf */
    .wolf-intro {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      perspective: 1000px;
    }

    .wolf-intro.active {
      display: flex;
      animation: fadeOutContainer 0.8s ease-in-out 3s forwards;
    }

    .wolf-logo-container {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      animation: zoomInLogo 2.8s cubic-bezier(0.215, 0.61, 0.355, 1) forwards;
    }

    .wolf-logo {
      width: 160px;
      height: 160px;
      border-radius: 0;
      object-fit: cover;
      box-shadow: 0 0 50px rgba(225, 29, 72, 0.9);
    }

    .wolf-text {
      margin-top: 15px;
      font-size: 36px;
      font-weight: 900;
      letter-spacing: 4px;
      color: #e11d48;
      text-transform: uppercase;
    }

    @keyframes zoomInLogo {
      0% { transform: scale(0.2); opacity: 0; filter: blur(12px); }
      25% { opacity: 1; filter: blur(0px); transform: scale(1); }
      70% { transform: scale(1.2); }
      100% { transform: scale(2.8); opacity: 0; filter: blur(10px); }
    }

    @keyframes fadeOutContainer {
      to { opacity: 0; visibility: hidden; }
    }

    /* شاشة الترحيب بالنص */
    .welcome-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #0d0d11;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 8888;
    }

    .welcome-screen.active {
      display: flex;
      animation: welcomeFadeInOut 1.5s ease-in-out forwards;
    }

    .welcome-screen img {
      width: 130px;
      height: 130px;
      object-fit: cover;
      border: 2px solid #e11d48;
      margin-bottom: 15px;
      border-radius: 0;
    }

    .welcome-screen h1 {
      font-size: 28px;
      color: #fff;
    }

    @keyframes welcomeFadeInOut {
      0% { opacity: 0; transform: scale(0.9); }
      20% { opacity: 1; transform: scale(1); }
      80% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; visibility: hidden; }
    }

    /* حاوية التحكم أعلى اليسار: صورة الحساب وتحتها اسمه، بجانب زر الإعدادات */
    .top-left-controls {
      position: absolute;
      top: 20px;
      left: 20px;
      display: none;
      align-items: center;
      gap: 12px;
      z-index: 100;
    }

    /* زر الإعدادات المربع */
    .settings-btn {
      width: 42px;
      height: 42px;
      background: #181820;
      border: 1px solid #333;
      color: #fff;
      font-size: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      border-radius: 0;
    }

    /* حاوية صورة الحساب والاسم تحتها */
    .user-profile-display {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
    }

    .user-avatar-img {
      width: 42px;
      height: 42px;
      object-fit: cover;
      border: 1px solid #e11d48;
      border-radius: 0;
    }

    .user-name-tag {
      margin-top: 3px;
      font-size: 10px;
      color: #ccc;
      font-weight: bold;
      max-width: 55px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: center;
    }

    /* البنر المتحرك العلوي (بدل الكلمة القديمة) */
    .hero-banner {
      width: 100%;
      max-width: 1400px;
      height: 280px;
      margin-top: 20px;
      position: relative;
      overflow: hidden;
      display: none;
      border-bottom: 2px solid #222;
    }

    .banner-slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      background-size: cover;
      background-position: center;
      transition: opacity 1s ease-in-out;
      display: flex;
      align-items: flex-end;
      padding: 30px;
    }

    .banner-slide.active {
      opacity: 1;
    }

    .banner-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to top, #0d0d11 10%, rgba(13, 13, 17, 0.4) 60%, rgba(0,0,0,0.8));
    }

    .banner-content {
      position: relative;
      z-index: 2;
    }

    .banner-content h2 {
      font-size: 32px;
      font-weight: 900;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
      margin-bottom: 8px;
    }

    .banner-content h2 span {
      color: #e11d48;
    }

    .banner-content p {
      font-size: 14px;
      color: #bbb;
      max-width: 500px;
      text-shadow: 0 1px 5px rgba(0,0,0,0.8);
    }

    /* واجهة الفيديوهات بطريقة نتفليكس (عناصر أصغر، أفقية، أو شبكة منظمة) */
    .section-title {
      width: 95%;
      max-width: 1400px;
      margin: 25px auto 10px auto;
      font-size: 20px;
      font-weight: bold;
      color: #fff;
      display: none;
      border-right: 4px solid #e11d48;
      padding-right: 10px;
    }

    .movies-grid {
      width: 95%;
      max-width: 1400px;
      margin: 0 auto 30px auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .movie-card {
      position: relative;
      background: #181820;
      aspect-ratio: 16 / 9; /* شكل أفقي مصغر شبيه بنتفليكس */
      cursor: pointer;
      overflow: hidden;
      border: 1px solid #222;
      border-radius: 4px;
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .movie-card:hover {
      transform: scale(1.05);
      border-color: #e11d48;
      z-index: 10;
      box-shadow: 0 8px 20px rgba(0,0,0,0.7);
    }

    .movie-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .play-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 35px;
      height: 35px;
      background: rgba(0, 0, 0, 0.7);
      border: 2px solid #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .movie-card:hover .play-btn {
      opacity: 1;
    }

    .play-btn::after {
      content: '';
      display: block;
      width: 0;
      height: 0;
      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;
      border-left: 10px solid #fff;
      margin-left: 2px;
    }

    /* النوافذ المنبثقة */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(5px);
      z-index: 10000;
    }

    .auth-box {
      background: #16161e;
      padding: 30px;
      border-radius: 0;
      width: 90%;
      max-width: 360px;
      border: 1px solid #2d2d3d;
      text-align: center;
      position: relative;
    }

    .close-btn {
      position: absolute;
      top: 10px;
      left: 15px;
      font-size: 20px;
      cursor: pointer;
      color: #888;
    }

    .input-group {
      margin-bottom: 15px;
      text-align: right;
    }

    .input-group label {
      display: block;
      margin-bottom: 5px;
      font-size: 13px;
      color: #aaa;
    }

    .input-group input, .input-group select {
      width: 100%;
      padding: 10px;
      border-radius: 0;
      border: 1px solid #333;
      background: #0d0d11;
      color: #fff;
      outline: none;
    }

    .password-container {
      position: relative;
      display: flex;
      align-items: center;
    }

    .password-container input {
      width: 100%;
    }

    .toggle-pass {
      position: absolute;
      left: 10px;
      background: none;
      border: none;
      color: #aaa;
      cursor: pointer;
      font-size: 13px;
    }

    .toggle-pass:hover {
      color: #fff;
    }

    .btn {
      width: 100%;
      padding: 11px;
      background: #e11d48;
      border: none;
      border-radius: 0;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn:hover { background: #be123c; }

    .switch-btn {
      background: transparent;
      border: 1px solid #e11d48;
      color: #e11d48;
    }

    .logout-btn {
      background: #282830;
      margin-top: 20px;
    }

    .logout-btn:hover { background: #e11d48; }

    .msg {
      margin-top: 12px;
      font-size: 13px;
      color: #ff5555;
    }
  </style>
</head>
<body>

  <!-- 1. نافذة التسجيل/الدخول -->
  <div class="modal-overlay" id="authModal">
    <div class="auth-box" id="stepChoice">
      <h2 style="margin-bottom: 15px;" data-i18n="welcomeTitle">مرحباً بك في WOLF CINEMA</h2>
      <button class="btn" onclick="showForm('login')" data-i18n="loginBtn">تسجيل الدخول</button>
      <button class="btn switch-btn" onclick="showForm('register')" data-i18n="registerBtn">إنشاء حساب</button>
    </div>

    <div class="auth-box" id="stepLogin" style="display: none;">
      <span class="close-btn" onclick="showStep(stepChoice)">✕</span>
      <h2 style="margin-bottom: 15px;" data-i18n="loginTitle">تسجيل الدخول</h2>
      <div class="input-group">
        <label data-i18n="usernameLabel">اسم المستخدم</label>
        <input type="text" id="loginUser" onpaste="return false;" oncopy="return false;" oncut="return false;">
      </div>
      <div class="input-group">
        <label data-i18n="passwordLabel">كلمة المرور</label>
        <div class="password-container">
          <input type="password" id="loginPass" onpaste="return false;" oncopy="return false;" oncut="return false;">
          <button type="button" class="toggle-pass" onclick="togglePassword('loginPass', this)" data-i18n="showPass">إظهار</button>
        </div>
      </div>
      <button class="btn" onclick="handleLogin()" data-i18n="enterBtn">دخول</button>
      <div class="msg" id="loginMsg"></div>
    </div>

    <div class="auth-box" id="stepRegister" style="display: none;">
      <span class="close-btn" onclick="showStep(stepChoice)">✕</span>
      <h2 style="margin-bottom: 15px;" data-i18n="registerTitle">إنشاء حساب جديد</h2>
      <div class="input-group">
        <label data-i18n="regUserLabel">اسم المستخدم (ثنائي وفوق)</label>
        <input type="text" id="regUser" onpaste="return false;" oncopy="return false;" oncut="return false;">
      </div>
      <div class="input-group">
        <label data-i18n="passwordLabel">كلمة المرور</label>
        <div class="password-container">
          <input type="password" id="regPass" onpaste="return false;" oncopy="return false;" oncut="return false;">
          <button type="button" class="toggle-pass" onclick="togglePassword('regPass', this)" data-i18n="showPass">إظهار</button>
        </div>
      </div>
      <button class="btn" onclick="handleRegister()" data-i18n="createAccBtn">إنشاء الحساب</button>
      <div class="msg" id="regMsg"></div>
    </div>
  </div>

  <!-- 2. أنيميشن مقدمة Wolf -->
  <div class="wolf-intro" id="introScreen">
    <div class="wolf-logo-container">
      <img class="wolf-logo" src="https://cdn.discordapp.com/attachments/1321582290043666504/1536526713532719164/Untitl55ed.png?ex=6a7bb983&is=6a7a6803&hm=cc76fafbeefea3d3c437f8f65fcb18bcd7aa03c53377b260cf9a156083570d6e&" alt="Wolf Logo">
      <div class="wolf-text">WOLF</div>
    </div>
  </div>

  <!-- 3. شاشة الترحيب بالنص -->
  <div class="welcome-screen" id="welcomeScreen">
    <img id="welcomeAvatar" src="" alt="Avatar">
    <h1><span data-i18n="welcomeGreeting">مرحباً بك،</span> <span id="welcomeUser"></span> 👋</h1>
  </div>

  <!-- 4. البنر المتحرك العلوي (بدل اسم الموقع القديم) -->
  <div class="hero-banner" id="heroBanner">
    <div class="banner-slide active" style="background-image: url('Uhttps://cdn.discordapp.com/attachments/1321582290043666504/1536526713532719164/Untitl55ed.png?ex=6a7bb983&is=6a7a6803&hm=cc76fafbeefea3d3c437f8f65fcb18bcd7aa03c53377b260cf9a156083570d6e&');">
      <div class="banner-overlay"></div>
      <div class="banner-content">
        <h2>WOLF <span>CINEMA</span></h2>
        <p data-i18n="bannerText1">استمتع بأحدث المقاطع والعروض الحصرية بجودة عالية.</p>
      </div>
    </div>
    <div class="banner-slide" style="background-image: url('https://cdn.discordapp.com/attachments/1321582290043666504/1536526713532719164/Untitl55ed.png?ex=6a7bb983&is=6a7a6803&hm=cc76fafbeefea3d3c437f8f65fcb18bcd7aa03c53377b260cf9a156083570d6e&');">
      <div class="banner-overlay"></div>
      <div class="banner-content">
        <h2>EXCLUSIVE <span>EDITS</span></h2>
        <p data-i18n="bannerText2">مكتبة متجددة من المقاطع والمحتوى المميز.</p>
      </div>
    </div>
  </div>

  <!-- حاوية التحكم أعلى اليسار: صورة الحساب وتحتها اسمه، بجانب زر الإعدادات -->
  <div class="top-left-controls" id="topLeftControls">
    <div class="user-profile-display" onclick="openSettings()" title="الملف الشخصي">
      <img id="navAvatarImg" class="user-avatar-img" src="https://cdn.discordapp.com/attachments/1321582290043666504/1536526713532719164/Untitl55ed.png?ex=6a7bb983&is=6a7a6803&hm=cc76fafbeefea3d3c437f8f65fcb18bcd7aa03c53377b260cf9a156083570d6e&" alt="صورة الحساب">

    </div>
    <div class="settings-btn" onclick="openSettings()" title="الإعدادات">⚙️</div>
  </div>

  <!-- عنوان القسم -->
  <div class="section-title" id="sectionTitle" data-i18n="sectionVideos">المقاطع والعروض</div>

  </div>

  <!-- نافذة الإعدادات -->
  <div class="modal-overlay" id="settingsModal" style="display: none;">
    <div class="auth-box">
      <span class="close-btn" onclick="closeSettings()">✕</span>
      <h2 style="margin-bottom: 15px;" data-i18n="settingsTitle">إعدادات الحساب</h2>
      
      <div class="input-group">
        <label data-i18n="changeUserLabel">تغيير اسم الحساب (ثنائي وفوق)</label>
        <input type="text" id="newUsernameInput" onpaste="return false;" oncopy="return false;" oncut="return false;">
      </div>

      <div class="input-group">
        <label data-i18n="langLabel">اختر اللغة / Select Language</label>
        <select id="langSelect">
          <option value="ar">العربية (Arabic)</option>
          <option value="en">English (إنجليزي)</option>
          <option value="es">Español (إسباني)</option>
          <option value="fr">Français (فرنسي)</option>
          <option value="de">Deutsch (ألماني)</option>
          <option value="tr">Türkçe (تركي)</option>
        </select>

      <button class="btn logout-btn" onclick="logout()" data-i18n="logoutBtn">تسجيل الخروج</button>
      <div class="msg" id="settingsMsg" style="color: #4CAF50;"></div>
    </div>
  </div>

  <script>
    const defaultAvatar = 'https://cdn.discordapp.com/attachments/1321582290043666504/1536526713532719164/Untitl55ed.png?ex=6a7bb983&is=6a7a6803&hm=cc76fafbeefea3d3c437f8f65fcb18bcd7aa03c53377b260cf9a156083570d6e&';

    // القواميس الخاصة باللغات
    const translations = {
      ar: {
        welcomeTitle: "مرحباً بك في WOLF CINEMA",
        loginBtn: "تسجيل الدخول",
        registerBtn: "إنشاء حساب",

        passwordLabel: "كلمة المرور",

        enterBtn: "دخول",

        welcomeGreeting: "مرحباً بك،",
        bannerText1: "استمتع بأحدث المقاطع والعروض الحصرية بجودة عالية.",
        bannerText2: "مكتبة متجددة من المقاطع والمحتوى المميز.",
        sectionVideos: "المقاطع والعروض",
        settingsTitle: "إعدادات الحساب",

    let currentLang = localStorage.getItem('appLang') || 'ar';

    function applyLanguage(lang) {
      if (lang === 'ar') {
        document.documentElement.setAttribute('dir', 'rtl');
        document.documentElement.setAttribute('lang', 'ar');
      } else {
        document.documentElement.setAttribute('dir', 'ltr');
        document.documentElement.setAttribute('lang', lang);
      }

      const elements = document.querySelectorAll('[data-i18n]');
      elements.forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (translations[lang] && translations[lang][key]) {
          el.innerText = translations[lang][key];
        }
      });
    }

    const authModal = document.getElementById('authModal');
    const stepChoice = document.getElementById('stepChoice');
    const stepLogin = document.getElementById('stepLogin');
    const stepRegister = document.getElementById('stepRegister');
    const introScreen = document.getElementById('introScreen');
    const welcomeScreen = document.getElementById('welcomeScreen');
    const topLeftControls = document.getElementById('topLeftControls');
    const settingsModal = document.getElementById('settingsModal');
    const moviesGrid = document.getElementById('moviesGrid');
    const heroBanner = document.getElementById('heroBanner');
    const sectionTitle = document.getElementById('sectionTitle');
    const fileInput = document.getElementById('fileInput');
    const langSelect = document.getElementById('langSelect');
    const navAvatarImg = document.getElementById('navAvatarImg');
    const navUsernameTag = document.getElementById('navUsernameTag');

    let uploadedImageBase64 = null;
    let bannerInterval = null;

    window.onload = function() {
      langSelect.value = currentLang;
      applyLanguage(currentLang);

      const activeUser = localStorage.getItem('activeSession');
      if (activeUser) {
        authModal.style.display = 'none';
        updateUserHeader(activeUser);
        startFullExperience(activeUser);
      } else {
        authModal.style.display = 'flex';
        showStep(stepChoice);
      }
    };

    function startBannerSlider() {
      const slides = document.querySelectorAll('.banner-slide');
      let currentSlide = 0;
      if (bannerInterval) clearInterval(bannerInterval);
      bannerInterval = setInterval(() => {
        slides[currentSlide].classList.remove('active');
        currentSlide = (currentSlide + 1) % slides.length;
        slides[currentSlide].classList.add('active');
      }, 4000);
    }

    function updateUserHeader(username) {
      const users = getUsers();
      const userObj = users[username];
      navUsernameTag.innerText = username;
      navAvatarImg.src = (userObj && userObj.avatar) ? userObj.avatar : defaultAvatar;
    }

    function startFullExperience(username) {
      introScreen.classList.add('active');
      setTimeout(() => {
        introScreen.classList.remove('active');
        showWelcomeScreen(username);
      }, 3500);
    }

    function showWelcomeScreen(username) {
      const users = getUsers();
      document.getElementById('welcomeUser').innerText = username;
      document.getElementById('welcomeAvatar').src = (users[username] && users[username].avatar) ? users[username].avatar : defaultAvatar;

      welcomeScreen.classList.add('active');
      setTimeout(() => {
        welcomeScreen.classList.remove('active');
        heroBanner.style.display = 'block';
        sectionTitle.style.display = 'block';
        topLeftControls.style.display = 'flex';
        moviesGrid.style.opacity = '1';
        startBannerSlider();
      }, 1500);
    }

    function showStep(step) {
      stepChoice.style.display = 'none';
      stepLogin.style.display = 'none';
      stepRegister.style.display = 'none';
      step.style.display = 'block';
      clearMessages();
    }

    function showForm(type) {
      if (type === 'login') showStep(stepLogin);
      if (type === 'register') showStep(stepRegister);
    }

    function clearMessages() {
      document.getElementById('loginMsg').innerText = '';
      document.getElementById('regMsg').innerText = '';
      document.getElementById('settingsMsg').innerText = '';
    }

    function getUsers() {
      return JSON.parse(localStorage.getItem('registeredUsers') || '{}');
    }

    function togglePassword(fieldId, btn) {
      const field = document.getElementById(fieldId);
      const isAr = currentLang === 'ar';
      if (field.type === 'password') {
        field.type = 'text';
        btn.innerText = isAr ? 'إخفاء' : 'Hide';
      } else {
        field.type = 'password';
        btn.innerText = isAr ? 'إظهار' : 'Show';
      }
    }

    function handleLogin() {
      const user = document.getElementById('loginUser').value.trim();
      const pass = document.getElementById('loginPass').value;
      const users = getUsers();

      if (!users[user] || users[user].pass !== pass) {
        document.getElementById('loginMsg').innerText = translations[currentLang].errLogin;
      } else {
        localStorage.setItem('activeSession', user);
        authModal.style.display = 'none';
        updateUserHeader(user);
        startFullExperience(user);
      }
    }

    function handleRegister() {
      const user = document.getElementById('regUser').value.trim();
      const pass = document.getElementById('regPass').value;

      if (!user || !pass) {
        document.getElementById('regMsg').innerText = currentLang === 'ar' ? "يرجى إدخال الاسم وكلمة المرور." : "Please enter username and password.";
        return;
      }

      if (user.length < 2) {
        document.getElementById('regMsg').innerText = translations[currentLang].errShort;
        return;
      }

        const users = getUsers();
      if (users[user]) {
        document.getElementById('regMsg').innerText = translations[currentLang].errTaken;
        return;
      }

      users[user] = { pass: pass, avatar: defaultAvatar };
      localStorage.setItem('registeredUsers', JSON.stringify(users));
      localStorage.setItem('activeSession', user);

      authModal.style.display = 'none';
      updateUserHeader(user);
      startFullExperience(user);
    }

    function openSettings() {
      const currentUser = localStorage.getItem('activeSession');
      document.getElementById('newUsernameInput').value = currentUser;
      langSelect.value = currentLang;
      settingsModal.style.display = 'flex';
      uploadedImageBase64 = null;
    }

    function closeSettings() {
      settingsModal.style.display = 'none';
      clearMessages();
    }

    fileInput.onchange = function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          uploadedImageBase64 = event.target.result;
          document.getElementById('settingsMsg').innerText = translations[currentLang].successImg;
        };
        reader.readAsDataURL(file);
      }
    };

    function saveSettings() {
      const currentUser = localStorage.getItem('activeSession');
      const newUsername = document.getElementById('newUsernameInput').value.trim();
      const selectedLang = langSelect.value;
      const users = getUsers();

      if (!newUsername) return;

      if (newUsername.length < 2) {
        document.getElementById('settingsMsg').style.color = '#ff5555';
        document.getElementById('settingsMsg').innerText = translations[currentLang].errShort;
        return;
      }

      if (newUsername !== currentUser && users[newUsername]) {
        document.getElementById('settingsMsg').style.color = '#ff5555';
        document.getElementById('settingsMsg').innerText = translations[currentLang].errTaken;
        return;
      }

      let userObj = users[currentUser];

      if (uploadedImageBase64) {
        userObj.avatar = uploadedImageBarbase64 || uploadedImageBase64;
      }

      if (newUsername !== currentUser) {
        delete users[currentUser];
        users[newUsername] = userObj;
        localStorage.setItem('activeSession', newUsername);
      } else {
        users[currentUser] = userObj;
      }

      localStorage.setItem('registeredUsers', JSON.stringify(users));
      
      currentLang = selectedLang;
      localStorage.setItem('appLang', selectedLang);
      applyLanguage(selectedLang);

      document.getElementById('settingsMsg').style.color = '#4CAF50';
      document.getElementById('settingsMsg').innerText = translations[currentLang].successSave;
      setTimeout(() => {
        closeSettings();
        location.reload();
      }, 800);
    }

    function logout() {
      localStorage.removeItem('activeSession');
      closeSettings();
      if (bannerInterval) clearInterval(bannerInterval);
      moviesGrid.style.opacity = '0';
      heroBanner.style.display = 'none';
      sectionTitle.style.display = 'none';
      topLeftControls.style.display = 'none';
      authModal.style.display = 'flex';
      showStep(stepChoice);
    }

    function openVideo(card) {
      const videoUrl = card.getAttribute('data-videourl');
      if (videoUrl && videoUrl.includes('.mp4')) {
        window.open(videoUrl, '_blank');
      } else {
        alert(currentLang === 'ar' ? 'الرجاء وضع رابط فيديو حقيقي في خاصية data-videourl' : 'Please insert a real video link in data-videourl');
      }
    }
  </script>
